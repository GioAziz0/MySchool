{% extends "users/base.html" %}
{% block title %}Accedi — MySchool{% endblock %}

{% block body %}
<div class="card">
  <div class="card-header">
    <div class="logo-wrap">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 2.18L19.6 9 12 12.82 4.4 9 12 5.18zM3 13.45V17c0 1.1 3.58 3 9 3s9-1.9 9-3v-3.55L12 17l-9-3.55z"/>
      </svg>
    </div>
    <h1 class="card-title">MySchool</h1>
    <p class="card-subtitle">Registro elettronico scolastico</p>
  </div>

  <div class="card-body">
    {% if error %}
    <div class="alert alert-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          class="form-input"
          type="text"
          id="username"
          name="username"
          value="{{ username|default:'' }}"
          placeholder="es. prof.rossi"
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-input"
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary">
        Accedi
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </form>
  </div>
</div>
{% endblock %}
