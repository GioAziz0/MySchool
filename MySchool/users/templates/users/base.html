<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MySchool{% endblock %}</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      min-height: 100vh;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 32px 64px rgba(0,0,0,.4);
      width: 100%;
      max-width: {% block card_max_width %}420px{% endblock %};
      overflow: hidden;
    }

    /* ── Logo / header ── */
    .card-header {
      text-align: center;
      padding: 36px 40px 28px;
    }

    .logo-wrap {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap svg { width: 30px; height: 30px; fill: white; }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -.4px;
    }

    .card-subtitle {
      margin-top: 5px;
      font-size: 14px;
      color: #64748b;
    }

    /* ── Card body ── */
    .card-body { padding: 0 40px 36px; }

    /* ── Form elements ── */
    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      letter-spacing: .2px;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: #fafafa;
    }

    .form-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
      background: #fff;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99,102,241,.35);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.7);
      border: 1px solid rgba(255,255,255,.15);
      font-size: 13px;
      padding: 8px 14px;
    }

    .btn-ghost:hover {
      background: rgba(255,255,255,.15);
      color: #fff;
    }

    /* ── Alert ── */
    .alert {
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    /* ── Glassmorphism cards (school/role selection) ── */
    .glass-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .glass-card {
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      padding: 28px 24px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all .2s;
      color: #fff;
    }

    .glass-card:hover {
      background: rgba(255,255,255,.18);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,.25);
      border-color: rgba(255,255,255,.35);
    }

    .glass-card:active { transform: translateY(-1px); }

    /* ── Auth page wrapper (for school/role selection) ── */
    .auth-page {
      width: 100%;
      max-width: 900px;
    }

    .auth-page-header {
      text-align: center;
      margin-bottom: 36px;
      color: #fff;
    }

    .auth-page-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .auth-page-header p {
      margin-top: 6px;
      font-size: 15px;
      color: rgba(255,255,255,.6);
    }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,.6);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 28px;
      transition: color .15s;
    }

    .back-link:hover { color: #fff; }

    /* ── Footer ── */
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,.3);
    }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <div class="auth-footer">MySchool &copy; {% now "Y" %}</div>
</body>
</html>
